version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crm-saas-db-prod
    environment:
      POSTGRES_USER: ${DB_USER:-crm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-crm_saas_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - crm-network-prod

  redis:
    image: redis:7-alpine
    container_name: crm-saas-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    restart: unless-stopped
    networks:
      - crm-network-prod

  backend:
    image: crm-saas-backend:latest
    container_name: crm-saas-api-prod
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - crm-network-prod

  frontend:
    image: crm-saas-frontend:latest
    container_name: crm-saas-web-prod
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_SOCKET_URL: ${SOCKET_URL}
      NEXT_PUBLIC_APP_NAME: CRM SaaS Platform
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - crm-network-prod

volumes:
  postgres_data_prod:
  redis_data_prod:

networks:
  crm-network-prod:
    driver: bridge
